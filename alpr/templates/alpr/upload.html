<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ALPR MERCOSUR – Demo</title>
<style>
*{box-sizing:border-box} 
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,sans-serif;margin:0;background:#0f172a;color:#e2e8f0}
.container{max-width:900px;margin:40px auto;padding:24px;background:#111827;border:1px solid #1f2937;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
h1{margin:0 0 12px;font-size:28px}
p.muted{color:#94a3b8;margin:0 0 20px}
.card{display:flex;gap:16px;align-items:center;background:#0b1220;border:1px solid #1f2937;border-radius:12px;padding:16px;margin-bottom:16px}
input[type=file]{padding:10px;background:#0f172a;border:1px dashed #334155;border-radius:8px;color:#e2e8f0;width:100%}
button{padding:10px 16px;border:none;border-radius:10px;background:#22c55e;color:#0b1220;font-weight:700;cursor:pointer}
button:hover{filter:brightness(1.1)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
pre{white-space:pre-wrap;background:#0b1220;border:1px solid #1f2937;padding:12px;border-radius:10px;max-height:400px;overflow:auto}
.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#1d4ed8;color:#e2e8f0;font-size:12px;margin-left:8px}
hr{border:none;border-top:1px solid #1f2937;margin:20px 0}
.preview{background:#0b1220;border:1px solid #1f2937;border-radius:12px;padding:10px;display:flex;justify-content:center;align-items:center;height:260px}
.preview img{max-height:240px;max-width:100%;object-fit:contain;border-radius:8px}
.slider-row{display:flex;align-items:center;gap:10px;margin-top:8px}
.slider-row span{width:40px;text-align:center;color:#94a3b8}
</style>
</head>

<body>
<div class="container">
  <h1>ALPR MERCOSUR – Demo <span class="badge">TFI 2025</span></h1>
  <p class="muted">Subí una imagen. El sistema ejecuta el OCR (tu modelo CNN entrenado) y te muestra el resultado.</p>

  <!-- FORM AJAX -->
  <form class="card" id="ocr-form" enctype="multipart/form-data">
    {% csrf_token %}
    <input id="file" type="file" name="image" accept="image/*" onchange="preview(event)" required/>
    <button type="submit">Procesar</button>
  </form>

  <!-- SLIDERS -->
  <div class="card" style="flex-direction:column;align-items:flex-start;">
      <label>Brillo</label>
      <div class="slider-row">
          <input type="range" id="brightness" name="brightness" min="-50" max="50" value="0">
          <span id="brightness-value">0</span>
      </div>

      <label style="margin-top:10px;">Contraste</label>
      <div class="slider-row">
          <input type="range" id="contrast" name="contrast" min="-50" max="50" value="0">
          <span id="contrast-value">0</span>
      </div>
  </div>

  <div class="grid">
    <div>
      <h3>Resultado</h3>
      <pre id="out">Esperando imagen...</pre>
    </div>

    <div>
      <h3>Vista previa</h3>
      <div class="preview"><img id="img" alt="preview"/></div>
    </div>
  </div>

  <hr/>
  <p class="muted">El front usa AJAX para enviar la imagen y sliders al backend. El backend ejecuta la CNN.</p>
</div>

<script>
// ================== PREVIEW ==================
function preview(e){
  const img=document.getElementById('img');
  const file=e.target.files[0];
  if(!file){ img.src=''; return; }
  const reader=new FileReader();
  reader.onload=ev=>{ img.src=ev.target.result; };
  reader.readAsDataURL(file);
}

// ================== SLIDERS ==================
brightness.oninput = () => brightness_value.textContent = brightness.value;
contrast.oninput = () => contrast_value.textContent = contrast.value;

// ================== AJAX ==================
document.getElementById("ocr-form").addEventListener("submit", async (e) => {
    e.preventDefault();

    const formData = new FormData();
    const imageInput = document.getElementById("file");
    const image = imageInput.files[0];

    if (!image) {
        alert("Subí una imagen primero.");
        return;
    }

    formData.append("image", image);
    formData.append("brightness", brightness.value);
    formData.append("contrast", contrast.value);

    const csrfToken = document.querySelector("[name=csrfmiddlewaretoken]").value;

    const response = await fetch("/alpr/api/predict/", {
        method: "POST",
        headers: {
            "X-CSRFToken": csrfToken,
            "X-Requested-With": "XMLHttpRequest"
        },
        body: formData
    });

    const data = await response.json();

    if (data.error) {
        document.getElementById("out").textContent = data.error;
        return;
    }

    const custom = data.custom_model;
    const external = data.external_ocr;

    let html = "";

    // ================== MODELO PROPIO ==================
    html += "Modelo propio:\n";
    html += `Patente: ${custom?.plate_text ?? "-"}\n`;
    html += `Confianza: ${
        custom?.confidence !== undefined
        ? (custom.confidence * 100).toFixed(1) + "%"
        : "-"
    }\n\n`;

    // ================== OCR CLÁSICO (TESSERACT) ==================
    html += "OCR clásico (Tesseract):\n";
    html += `Patente: ${external?.plate_text ?? "-"}\n`;
    html += `Confianza aprox.: ${
        external?.confidence !== undefined
        ? (external.confidence * 100).toFixed(1) + "%"
        : "-"
    }\n`;

    if (external?.error) {
        html += `\nNota: ${external.error}\n`;
    }

    document.getElementById("out").textContent = html;
});
</script>


</body>
</html>
